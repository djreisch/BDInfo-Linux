name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Build
        run: make -j"$(nproc)"

      - name: Check the binary is self-contained
        run: |
          file bdinfo
          file bdinfo | grep -q "statically linked"

      - name: Smoke test
        run: |
          set -x
          ./bdinfo --version
          test "$(./bdinfo --version)" = "$(cat VERSION)"
          ./bdinfo --help | grep -q "Usage: bdinfo"
          # Usage errors exit with 2, a missing disc with 1.
          set +e
          ./bdinfo --bogus;               test $? -eq 2 || exit 1
          ./bdinfo /nonexistent;          test $? -eq 1 || exit 1
          ./bdinfo "$RUNNER_TEMP";        test $? -eq 1 || exit 1
          exit 0

      - name: Package
        run: |
          name="bdinfo-$(cat VERSION)-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp bdinfo LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "PACKAGE=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: bdinfo-linux-${{ matrix.arch }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
